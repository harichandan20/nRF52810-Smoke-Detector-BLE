# ---- basics ----
CONFIG_GPIO=y
CONFIG_MAIN_STACK_SIZE=2048

# ---- Bluetooth ----
CONFIG_BT=y
CONFIG_BT_PERIPHERAL=y
CONFIG_BT_MAX_CONN=1
CONFIG_BT_DEVICE_NAME="BEDROOM2"

# longest packet is 109 bytes, so an MTU of 112 is enough
CONFIG_BT_L2CAP_TX_MTU=112
CONFIG_BT_BUF_ACL_RX_SIZE=116

# ---- save RAM (nRF52810 has only 24 KB) ----
CONFIG_BT_GATT_CACHING=n
CONFIG_SERIAL=n
CONFIG_CONSOLE=n
CONFIG_UART_CONSOLE=n

# ---- no external 32.768 kHz crystal: use the internal RC oscillator ----
CONFIG_CLOCK_CONTROL_NRF_K32SRC_RC=y
CONFIG_CLOCK_CONTROL_NRF_K32SRC_500PPM=y